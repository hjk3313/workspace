<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전체 후기 - 풍덩</title>
  <meta name="description" content="풍덩 방문자들이 남긴 후기를 최신순으로 모아봤어요.">
  <meta property="og:title" content="전체 후기 - 풍덩">
  <meta property="og:description" content="풍덩 방문자들이 남긴 후기를 최신순으로 모아봤어요.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.pungdeong.com/reviews">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Google AdSense: 광고 단위 실제로 만들면 type="text/plain" 지우고 활성화. 지금은 슬롯이 없어 로드하면 낭비. -->
  <script type="text/plain" data-note="ca-pub-1475889248445126" async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1475889248445126" crossorigin="anonymous"></script>
</head>

<body>

  <header>
    <div>
      <h1>전체 후기</h1>
      <p>모든 방문자가 남긴 후기를 최신순으로 모아봤어요</p>
    </div>
    <nav class="site-nav">
      <a href="/">지도</a>
      <a href="/favorites">즐겨찾기</a>
      <a href="/reviews" class="current">전체 후기</a>
      <a href="/guide">안전가이드</a>
      <a href="/register">장소 등록</a>
    </nav>
  </header>

  <main>
  <div id="feedList" class="page-list"></div>
  </main>

  <div class="modal-overlay" id="reviewModalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="reviewModalTitle"></h3>
        <button class="modal-close-btn" id="reviewModalClose">닫기</button>
      </div>
      <div id="reviewList"></div>
      <form id="reviewForm">
        <input id="reviewNickname" type="text" placeholder="닉네임 (선택, 비우면 익명)">
        <select id="reviewRating">
          <option value="5">5점 - 최고예요</option>
          <option value="4">4점 - 좋아요</option>
          <option value="3" selected>3점 - 보통</option>
          <option value="2">2점 - 별로예요</option>
          <option value="1">1점 - 비추천</option>
        </select>
        <textarea id="reviewComment" rows="3" placeholder="후기를 남겨주세요" required></textarea>
        <button type="submit">후기 등록</button>
        <span id="reviewStatus"></span>
      </form>
    </div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/reviews-widget.js"></script>
  <script>
    async function loadFeed() {
      const list = document.getElementById("feedList");
      list.innerHTML = '<div class="empty-state">불러오는 중...</div>';
      try {
        const res = await supabaseFetch("reviews?select=*&order=created_at.desc&limit=200");
        if (!res.ok) throw new Error("failed");
        const rows = await res.json();
        if (!rows.length) {
          list.innerHTML = '<div class="empty-state">아직 등록된 후기가 없어요.<br><a href="/">지도에서 장소를 찾아</a> 첫 후기를 남겨보세요.</div>';
          return;
        }
        list.innerHTML = "";
        rows.forEach(r => {
          const spot = SPOT_BY_NAME[r.spot_name];
          const item = document.createElement("div");
          item.className = "item";
          item.innerHTML = `
            <div class="row1">
              <span class="name">${spot ? `<span class="dot ${spot.type}"></span>` : ""}${r.spot_name}</span>
              <span class="region">${spot ? spot.region : ""}</span>
            </div>
            <div class="stats">${r.nickname || "익명"} · ${r.rating}점 · ${new Date(r.created_at).toLocaleDateString("ko-KR")}</div>
            <div class="note">${r.comment}</div>
            <div class="badges"><button class="review-btn">이 장소에 후기 남기기</button></div>
          `;
          item.querySelector(".review-btn").addEventListener("click", () => openReviewModal(r.spot_name));
          list.appendChild(item);
        });
      } catch (err) {
        list.innerHTML = '<div class="empty-state">후기를 불러오지 못했습니다. Supabase 설정을 확인하세요.</div>';
      }
    }

    initReviewModal(() => loadFeed());
    loadFeed();
  </script>

  <footer><a href="/privacy">개인정보처리방침</a></footer>

</body>

</html>
