<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계산기</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #1e1f26;
    --panel: #2a2b35;
    --display: #14151a;
    --text: #f5f5f7;
    --muted: #9a9aa5;
    --key: #3a3b47;
    --key-hover: #464755;
    --op: #ff9f0a;
    --op-hover: #ffb340;
    --danger: #d64545;
    --danger-hover: #e35d5d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .calculator {
    width: 320px;
    background: var(--panel);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
  }

  .display {
    background: var(--display);
    border-radius: 14px;
    padding: 24px 18px 16px;
    margin-bottom: 16px;
    text-align: right;
    overflow: hidden;
  }

  .display .expression {
    color: var(--muted);
    font-size: 15px;
    min-height: 20px;
    white-space: nowrap;
    overflow-x: auto;
  }

  .display .result {
    color: var(--text);
    font-size: 40px;
    font-weight: 600;
    margin-top: 6px;
    white-space: nowrap;
    overflow-x: auto;
  }

  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button {
    border: none;
    border-radius: 12px;
    padding: 18px 0;
    font-size: 20px;
    font-weight: 500;
    color: var(--text);
    background: var(--key);
    cursor: pointer;
    transition: background 0.12s ease, transform 0.05s ease;
  }

  button:hover { background: var(--key-hover); }
  button:active { transform: scale(0.96); }

  button.operator { background: var(--op); color: #1e1f26; font-weight: 600; }
  button.operator:hover { background: var(--op-hover); }

  button.function { color: var(--muted); }

  button.danger { background: var(--danger); color: #fff; }
  button.danger:hover { background: var(--danger-hover); }

  button.equals { background: var(--op); color: #1e1f26; font-weight: 700; }
  button.equals:hover { background: var(--op-hover); }

  button.zero { grid-column: span 2; }
</style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="expression" id="expression">&nbsp;</div>
    <div class="result" id="result">0</div>
  </div>

  <div class="keys">
    <button class="function" data-action="clear">AC</button>
    <button class="function" data-action="negate">+/-</button>
    <button class="function" data-action="percent">%</button>
    <button class="operator" data-action="operator" data-value="÷">÷</button>

    <button data-action="digit" data-value="7">7</button>
    <button data-action="digit" data-value="8">8</button>
    <button data-action="digit" data-value="9">9</button>
    <button class="operator" data-action="operator" data-value="×">×</button>

    <button data-action="digit" data-value="4">4</button>
    <button data-action="digit" data-value="5">5</button>
    <button data-action="digit" data-value="6">6</button>
    <button class="operator" data-action="operator" data-value="−">−</button>

    <button data-action="digit" data-value="1">1</button>
    <button data-action="digit" data-value="2">2</button>
    <button data-action="digit" data-value="3">3</button>
    <button class="operator" data-action="operator" data-value="+">+</button>

    <button class="zero" data-action="digit" data-value="0">0</button>
    <button data-action="decimal">.</button>
    <button class="equals" data-action="equals">=</button>
  </div>
</div>

<script>
(() => {
  const expressionEl = document.getElementById('expression');
  const resultEl = document.getElementById('result');

  let current = '0';
  let previous = null;
  let operator = null;
  let justEvaluated = false;

  const OPS = {
    '+': (a, b) => a + b,
    '−': (a, b) => a - b,
    '×': (a, b) => a * b,
    '÷': (a, b) => (b === 0 ? NaN : a / b),
  };

  function formatNumber(n) {
    if (!isFinite(n)) return 'Error';
    const rounded = Math.round(n * 1e10) / 1e10;
    return rounded.toString();
  }

  function updateDisplay() {
    resultEl.textContent = current;
    expressionEl.textContent = previous !== null && operator
      ? `${formatNumber(previous)} ${operator}`
      : ' ';
  }

  function inputDigit(d) {
    if (justEvaluated) {
      current = d;
      justEvaluated = false;
    } else {
      current = current === '0' ? d : current + d;
    }
  }

  function inputDecimal() {
    if (justEvaluated) {
      current = '0.';
      justEvaluated = false;
      return;
    }
    if (!current.includes('.')) current += '.';
  }

  function clearAll() {
    current = '0';
    previous = null;
    operator = null;
    justEvaluated = false;
  }

  function negate() {
    if (current === '0') return;
    current = current.startsWith('-') ? current.slice(1) : '-' + current;
  }

  function percent() {
    current = formatNumber(parseFloat(current) / 100);
  }

  function chooseOperator(op) {
    if (operator && !justEvaluated) {
      evaluate();
    }
    previous = parseFloat(current);
    operator = op;
    justEvaluated = true;
  }

  function evaluate() {
    if (operator === null || previous === null) return;
    const a = previous;
    const b = parseFloat(current);
    const value = OPS[operator](a, b);
    current = formatNumber(value);
    previous = null;
    operator = null;
    justEvaluated = true;
  }

  document.querySelector('.keys').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const { action, value } = btn.dataset;

    switch (action) {
      case 'digit': inputDigit(value); break;
      case 'decimal': inputDecimal(); break;
      case 'clear': clearAll(); break;
      case 'negate': negate(); break;
      case 'percent': percent(); break;
      case 'operator': chooseOperator(value); break;
      case 'equals': evaluate(); break;
    }
    updateDisplay();
  });

  const KEY_MAP = { '*': '×', '/': '÷', '-': '−' };

  window.addEventListener('keydown', (e) => {
    if (/^[0-9]$/.test(e.key)) inputDigit(e.key);
    else if (e.key === '.') inputDecimal();
    else if (e.key === 'Enter' || e.key === '=') evaluate();
    else if (e.key === 'Backspace') {
      current = current.length > 1 ? current.slice(0, -1) : '0';
    }
    else if (e.key === 'Escape') clearAll();
    else if (['+', '-', '*', '/'].includes(e.key)) chooseOperator(KEY_MAP[e.key] || e.key);
    else return;
    updateDisplay();
  });

  updateDisplay();
})();
</script>

</body>
</html>
